apiVersion: v1
kind: Service
metadata:
  name: sink
  labels:
    app.kubernetes.io/name: sink
    app.kubernetes.io/component: rest-sink
    app.kubernetes.io/version: "0.9.2"
spec:
  selector:
    app.kubernetes.io/name: sink
    app.kubernetes.io/component: rest-sink
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  labels:
    app.kubernetes.io/name: sink
    app.kubernetes.io/component: rest-sink
    app.kubernetes.io/version: "0.9.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sink
      app.kubernetes.io/component: rest-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sink
        app.kubernetes.io/component: rest-sink
        app.kubernetes.io/version: "0.9.2"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Arbitrary non-root uid: the image has no USER instruction and the app needs no
        # particular identity. 65532 is the conventional "nonroot" uid.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo-server
          image: ealen/echo-server:0.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Default is 80, which a non-root process cannot bind once NET_BIND_SERVICE
            # has been dropped.
            - name: PORT
              value: "8080"
          # Two different checks: readiness asks the app to actually build a JSON echo
          # response for a real path, liveness only asks whether the listener accepts a
          # request at all. A sink that is looping inside request handling fails readiness
          # first and is taken out of the Service before liveness restarts it.
          readinessProbe:
            httpGet:
              path: /api/AudioDevices/readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Node needs a writable temp dir even with a read-only root filesystem.
        - name: tmp
          emptyDir: {}
