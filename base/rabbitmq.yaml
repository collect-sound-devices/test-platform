# Headless: the StatefulSet needs stable per-pod DNS (rabbitmq-0.rabbitmq), and nothing
# here wants round-robin load balancing across brokers. The forwarder connects to the
# Service name "rabbitmq", which a headless Service resolves straight to the pod IP.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "3.13"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: broker
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "3.13"
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: broker
        app.kubernetes.io/version: "3.13"
    spec:
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image has no USER instruction and would run as root. Its own user is 999,
        # but the convention here is image uid + 10000: kube-score wants an id above
        # 10 000 so a container uid cannot collide with a real account on the node.
        # Nothing in this image needs a matching /etc/passwd entry — HOME is set
        # explicitly to /var/lib/rabbitmq — and its data directories are mode 1777.
        runAsUser: 10999
        runAsGroup: 10999
        # Makes the PVC and the emptyDirs below group-owned by 10999, which is what lets
        # the broker write its mnesia directory and its log.
        fsGroup: 10999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            # The default "guest" account is refused on any non-loopback connection, so
            # without this the forwarder cannot authenticate even with correct credentials.
            - name: RABBITMQ_LOOPBACK_USERS
              value: "none"
          # Two genuinely different checks (brief §7): "ping" only asks whether the Erlang
          # node answers, "status" additionally reports that the application and its
          # listeners are up. A broker that is alive but not yet serving fails readiness
          # while still passing liveness, so it is not restarted while starting.
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            # The three writes a read-only root filesystem would otherwise block. Note the
            # mount is on conf.d, not on /etc/rabbitmq: the entrypoint generates its
            # config there, but /etc/rabbitmq itself holds the image's enabled_plugins
            # file, and covering that would silently disable the management plugin.
            - name: config
              mountPath: /etc/rabbitmq/conf.d
            - name: logs
              mountPath: /var/log/rabbitmq
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rabbitmq
          app.kubernetes.io/component: broker
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
