# Documents the key names only. This file is NOT applied and is NOT part of the
# kustomization — the real Secret is created at deploy time by scripts/up.sh with a
# password generated on the spot, and never written to the repository (brief §7, §13).
#
# To create it by hand:
#
#   kubectl -n test-platform create secret generic rabbitmq-credentials \
#     --from-literal=username=demo \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# Both the broker and the forwarder read this one Secret, under different variable names:
#   rabbitmq  RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS
#   forwarder RabbitMQ__Service__UserName / RabbitMQ__Service__Password
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: test-platform
type: Opaque
stringData:
  username: "REPLACE_ME"
  password: "REPLACE_ME"
